[package]
name = "spec"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.42"
clap = { version = "3.2.7", features = ["derive"] }
mimalloc = { version = "0.1.26", default-features = false, optional = true }
petgraph = "0.6.0"
itertools = "0.10.0"
rustc-hash = "1.1.0"
serde_json = "1.0.68"

draw = { path = "../../../../lib/draw" }
paths = { path = "../../../../lib/paths" }
spectrum = { path = "../../../../lib/spectrum" }
balloon = { path = "../../../../lib/balloon" }
constants = { path = "../../../../lib/constants" }
peptide = { path = "../../../../lib/peptide" }

[features]
default = ["mimalloc"]
