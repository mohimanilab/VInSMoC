[package]
name = "chem_db"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.42"
clap = { version = "3.2.7", features = ["derive"] }
csv = "1"
memchr = "2.5.0"
memmap2 = "0.5.10"
mimalloc = { version = "0.1.26", default-features = false, optional = true }
rustc-hash = "1.1.0"

chemical_db = { path = "../../../../lib/chemical_db" }
dereplicate = { path = "../../../../lib/dereplicate" }
spectrum = { path = "../../../../lib/spectrum" }

[features]
default = ["mimalloc"]
