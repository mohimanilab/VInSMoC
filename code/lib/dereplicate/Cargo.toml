[package]
name = "dereplicate"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "3.2.7", features = ["derive"] }
dashmap = "5.0.0"
serde = { version = "1.0", features = ["derive", "rc"]}
serde_json = "1.0"
rand = "0.8.3"
rustc-hash = "1.1.0"
csv = "1"
rayon = "1.5"
thiserror = "^1.0.25"
ordered-float = "2.8.0"
rkyv = "0.7.15"

paths = { path = "../paths" }
spectrum = { path = "../spectrum" }
mcmc = { path = "../mcmc" }
molecule = { path = "../molecule" }
constants = { path = "../constants" }
chemical_db = { path = "../chemical_db" }

[dev-dependencies]
petgraph = "0.6.2"
tempfile = "3.2.0"
anyhow = "1.0.42"
